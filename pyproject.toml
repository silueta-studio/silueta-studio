[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silueta-studio"
version = "0.1.0"
description = "Vertical story videos with 2D silhouettes, rim light and karaoke captions, built for Claude Code."
readme = "README.md"
authors = [{ name = "Silueta Studio" }]
keywords = ["video", "shorts", "animation", "silhouette", "karaoke", "claude-code", "whisperx"]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.1", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/silueta-studio/silueta-studio"
Repository = "https://github.com/silueta-studio/silueta-studio"
Issues = "https://github.com/silueta-studio/silueta-studio/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
silueta = "silueta_studio.cli:main"

[tool.setuptools]
packages = ["silueta_studio"]

[tool.setuptools.package-data]
silueta_studio = ["modelo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
